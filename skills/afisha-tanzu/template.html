<!doctype html><html lang="ru"><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px}
body{font-family:'Oswald',sans-serif;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 40%, #2c4794 0%, #1b2f6b 46%, #111d44 78%, #0c1430 100%);
  color:#f3e6c4}
#orn{position:absolute;inset:0;z-index:1}
#ornFg{position:absolute;inset:0;z-index:4;pointer-events:none}
.grain{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:5px 5px}
.wrap{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;
  align-items:center;padding:96px 70px 0;z-index:5}
.kicker{font-weight:500;letter-spacing:.42em;font-size:28px;color:#e8b93f;
  text-transform:uppercase;display:flex;align-items:center;gap:22px}.kicker .st{font-size:24px}
.name{font-family:'Playfair Display',serif;font-weight:900;font-size:118px;line-height:.9;
  text-align:center;color:#f6eccf;text-transform:uppercase;margin-top:24px;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.sub{font-weight:500;letter-spacing:.30em;font-size:26px;color:#e8b93f;text-transform:uppercase;
  margin-top:22px;white-space:nowrap}
.figwrap{position:absolute;bottom:214px;left:50%;transform:translateX(-50%);width:880px;z-index:3;
  filter:drop-shadow(0 20px 40px rgba(0,0,0,.5))}
.figwrap img{width:100%;display:block}
.dateblock{position:absolute;left:0;right:0;bottom:0;height:300px;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:62px}
.cart{display:flex;align-items:center;gap:26px;color:#e8b93f}.cart .st{font-size:30px}
.date{font-weight:700;font-size:120px;line-height:.84;color:#e8b93f;text-transform:uppercase;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.time{font-weight:400;letter-spacing:.34em;font-size:32px;color:#f6eccf;margin-top:14px}
.city{font-weight:500;letter-spacing:.5em;font-size:24px;color:#9fb0e0;margin-top:10px}
</style></head><body>
<svg id="orn" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice"></svg>
<div class="grain"></div>
<div class="wrap">
  <div class="kicker"><span class="st">&#10038;</span>Раджастанская традиция<span class="st">&#10038;</span></div>
  <div class="name">Карина<br>Клавихо</div>
  <div class="sub">Мастер-класс &middot; World Fusion</div>
</div>
<div class="figwrap"><img src="fig_cut.png?v5"></div>
<svg id="ornFg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice"></svg>
<div class="dateblock">
  <div class="cart"><span class="st">&#10038;</span><div class="date">4 июля</div><span class="st">&#10038;</span></div>
  <div class="time">16:00 &mdash; 18:00</div>
  <div class="city">Москва</div>
</div>
<script>
const NS='http://www.w3.org/2000/svg',B=document.getElementById('orn'),F=document.getElementById('ornFg');
const G='#e8b93f';
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const add=(e,p)=>{(p||B).appendChild(e);return e;};
const defs=el('defs',{});
const gl=el('radialGradient',{id:'gl'});
gl.appendChild(el('stop',{offset:'0%','stop-color':'#3a59a8','stop-opacity':.9}));
gl.appendChild(el('stop',{offset:'100%','stop-color':'#1b2f6b','stop-opacity':0}));
defs.appendChild(gl);add(defs);
// ---------- PLANE 2: dense star field ----------
for(let i=0;i<920;i++){const x=Math.random()*1080,y=Math.random()*1920,r=Math.random()*1.9+.3;
  add(el('circle',{cx:x,cy:y,r,fill:'#cdd8ff',opacity:(.12+Math.random()*.5).toFixed(2)}));}
// ---------- PLANE 3: big faint outer rings + ticks (canvas-wide) ----------
[440,560,700,860,1040].forEach(rr=>add(el('circle',{cx:540,cy:900,r:rr,fill:'none',stroke:G,'stroke-width':1,opacity:.10})));
{const OT=120;for(let i=0;i<OT;i++){const a=i/OT*2*Math.PI;
  add(el('line',{x1:540+560*Math.cos(a),y1:900+560*Math.sin(a),x2:540+700*Math.cos(a),y2:900+700*Math.sin(a),stroke:G,'stroke-width':1,opacity:.09}));}}
// ---------- reusable bits ----------
function petalRing(mx,my,R,T,tip,op,tgt){for(let i=0;i<T;i++){const a=i/T*2*Math.PI,sp=Math.PI/T*0.92;
  const lx=mx+R*Math.cos(a-sp),ly=my+R*Math.sin(a-sp),rx=mx+R*Math.cos(a+sp),ry=my+R*Math.sin(a+sp);
  const tx=mx+(R+tip)*Math.cos(a),ty=my+(R+tip)*Math.sin(a);
  add(el('path',{d:`M${lx} ${ly} Q${tx} ${ty} ${rx} ${ry}`,fill:'none',stroke:G,'stroke-width':1,opacity:op}),tgt);}}
function mandala(mx,my,R,raysN,op,glow,tgt){
  if(glow)add(el('circle',{cx:mx,cy:my,r:R,fill:'url(#gl)'}),tgt);
  [.40,.50,.60,.70,.80,.97,1].forEach((k,i)=>add(el('circle',{cx:mx,cy:my,r:R*k,fill:'none',stroke:G,'stroke-width':(i===6?2:1),opacity:op}),tgt));
  for(let i=0;i<raysN;i++){const a=i/raysN*2*Math.PI,long=i%2===0,r1=R*0.70,r2=long?R*0.94:R*0.84;
    add(el('line',{x1:mx+r1*Math.cos(a),y1:my+r1*Math.sin(a),x2:mx+r2*Math.cos(a),y2:my+r2*Math.sin(a),stroke:G,'stroke-width':long?1.4:.8,opacity:op}),tgt);}
  petalRing(mx,my,R*0.58,Math.round(raysN/3),R*0.18,op*0.85,tgt);
  petalRing(mx,my,R*0.40,Math.round(raysN/4.5),R*0.12,op*0.7,tgt);
  const D=Math.round(raysN/2.2);for(let i=0;i<D;i++){const a=i/D*2*Math.PI;
    add(el('circle',{cx:mx+R*0.50*Math.cos(a),cy:my+R*0.50*Math.sin(a),r:R*0.012+1.4,fill:G,opacity:op}),tgt);}
  add(el('circle',{cx:mx,cy:my,r:R*0.07,fill:G,opacity:op}),tgt);
}
// ---------- THREE+ mandalas. Main one on back layer (peeks around head);
//            side/lower ones on FOREGROUND F so the figure box can't occlude them ----------
mandala(540,628,290,120,.85,true);     // main — behind head (back layer)
mandala(208,600,116,52,.62,true,F);    // upper-left pocket beside raised arm (front)
mandala(872,600,116,52,.62,true,F);    // upper-right pocket (front)
mandala(146,1486,92,44,.5,true,F);     // lower-left dark triangle by the skirt hem (front)
mandala(934,1486,92,44,.5,true,F);     // lower-right dark triangle (front)
// ---------- small rosette (reused on border + scatter) ----------
function rosette(x,y,r,op,tgt){
  add(el('circle',{cx:x,cy:y,r,fill:'none',stroke:G,'stroke-width':1.3,opacity:op}),tgt);
  add(el('circle',{cx:x,cy:y,r:r*0.55,fill:'none',stroke:G,'stroke-width':1,opacity:op}),tgt);
  for(let i=0;i<12;i++){const a=i/12*2*Math.PI;add(el('line',{x1:x+r*Math.cos(a),y1:y+r*Math.sin(a),x2:x+(r+6)*Math.cos(a),y2:y+(r+6)*Math.sin(a),stroke:G,'stroke-width':1.1,opacity:op}),tgt);}
  add(el('circle',{cx:x,cy:y,r:2.4,fill:G,opacity:op}),tgt);
}
// ---------- PLANE 1b: triple frame + dotted inner ----------
function frame(inset,sw,op,tgt){add(el('rect',{x:inset,y:inset,width:1080-2*inset,height:1920-2*inset,fill:'none',stroke:G,'stroke-width':sw,opacity:op}),tgt);}
frame(30,2.6,.9);frame(44,1.2,.6);frame(58,1,.4);
{const fx0=74,fy0=74,fx1=1006,fy1=1846;
 for(let x=fx0;x<=fx1;x+=24){add(el('circle',{cx:x,cy:fy0,r:2,fill:G,opacity:.5}));add(el('circle',{cx:x,cy:fy1,r:2,fill:G,opacity:.5}));}
 for(let y=fy0;y<=fy1;y+=24){add(el('circle',{cx:fx0,cy:y,r:2,fill:G,opacity:.5}));add(el('circle',{cx:fx1,cy:y,r:2,fill:G,opacity:.5}));}}
// ---------- PLANE 7 (foreground F): corner clusters + border rosettes + side garlands + scatter ----------
function cornerCluster(x,y,sx,sy){
  const g=el('g',{transform:`translate(${x} ${y}) scale(${sx} ${sy})`,stroke:G,'stroke-width':1.6,fill:'none',opacity:.9});
  g.appendChild(el('circle',{cx:0,cy:0,r:30}));g.appendChild(el('circle',{cx:0,cy:0,r:18}));
  for(let i=0;i<14;i++){const a=i/14*2*Math.PI;const e=document.createElementNS(NS,'line');
    e.setAttribute('x1',30*Math.cos(a));e.setAttribute('y1',30*Math.sin(a));e.setAttribute('x2',40*Math.cos(a));e.setAttribute('y2',40*Math.sin(a));g.appendChild(e);}
  g.appendChild(el('circle',{cx:0,cy:0,r:5,fill:G,stroke:'none'}));
  g.appendChild(el('path',{d:'M44 6 q70 4 86 80'}));g.appendChild(el('path',{d:'M6 44 q4 70 80 86'}));
  g.appendChild(el('path',{d:'M70 70 q26 -14 50 4 q-26 -2 -50 -4',fill:G,stroke:'none'}));
  add(g,F);}
cornerCluster(96,96,1,1);cornerCluster(984,96,-1,1);cornerCluster(96,1824,1,-1);cornerCluster(984,1824,-1,-1);
// border rosettes — rows along all four frame edges
for(let x=150;x<=930;x+=130){rosette(x,52,15,.55,F);rosette(x,1868,15,.55,F);}
for(let y=190;y<=1730;y+=130){rosette(52,y,15,.5,F);rosette(1028,y,15,.5,F);}
// side paisley garland columns
function paisleyCol(x,flip){for(let k=0;k<7;k++){const y=330+k*200;
  const g=el('g',{transform:`translate(${x} ${y}) scale(${flip*0.85} 0.85)`,stroke:G,'stroke-width':1.3,fill:'none',opacity:.5});
  g.appendChild(el('path',{d:'M0 0 C46 -8 54 40 24 54 C0 66 -12 44 4 34 C14 28 22 34 20 44'}));
  g.appendChild(el('circle',{cx:11,cy:24,r:2.4,fill:G,stroke:'none'}));add(g,F);}}
paisleyCol(108,1);paisleyCol(972,-1);
// scattered small suns + star glyphs across negative space
function smallSun(x,y,r,op){add(el('circle',{cx:x,cy:y,r,fill:'none',stroke:G,'stroke-width':1.4,opacity:op}),F);
  for(let i=0;i<10;i++){const a=i/10*2*Math.PI;add(el('line',{x1:x+r*Math.cos(a),y1:y+r*Math.sin(a),x2:x+(r+6)*Math.cos(a),y2:y+(r+6)*Math.sin(a),stroke:G,'stroke-width':1.2,opacity:op}),F);}}
smallSun(230,470,14,.6);smallSun(850,470,12,.55);smallSun(150,1500,13,.55);smallSun(930,1500,14,.6);
smallSun(330,900,9,.4);smallSun(750,900,9,.4);
for(let i=0;i<34;i++){const a=Math.random()*2*Math.PI,r=330+Math.random()*150;
  add(el('text',{x:540+r*Math.cos(a),y:900+r*Math.sin(a),fill:G,'font-size':14+Math.random()*12,opacity:.5,'text-anchor':'middle'}),F).textContent='✸';}
</script>
</body></html>
