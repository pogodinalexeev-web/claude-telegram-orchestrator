# ЗАГОТОВКА (шаг 6 пересборки, 19.08.2026). Перенос drop-in'а с живого юнита
# claude-tg-bot.service.d/sandbox.conf — снят 19.08 в inventory/units-owner.txt.
#
# ВАЖНО: положен в ЛИЧНУЮ папку экземпляра (claude-tg-bot@owner.service.d/),
# а не в общую (claude-tg-bot@.service.d/). Причина: послабления ниже сделаны
# под Хозяина — ему нужен браузер с песочницей и sudo без пароля. Раздать то же
# самое ботам Alpha, Beta и Gamma — значит молча снять с них ограничения,
# которых они не просили. Общая папка = общие права, это не то, что нам надо.
#
# Исходный комментарий 2026-05-25 12:22, дословно:
#   relaxed by claude itself.
#   Reason: hardening blocked chromium sandbox (RestrictNamespaces,
#   SystemCallFilter, RestrictSUIDSGID) AND sudo NOPASSWD (NoNewPrivileges).
#   Bot == Owner по правам, доп. изоляция бессмысленна.
#   Backup: sandbox.conf.bak-2026-05-25-1222 рядом.
[Service]
NoNewPrivileges=no
PrivateTmp=yes
PrivateDevices=no
ProtectSystem=full
ProtectKernelTunables=no
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=no
RestrictRealtime=yes
RestrictNamespaces=
LockPersonality=yes
RemoveIPC=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
SystemCallArchitectures=native
SystemCallFilter=
SystemCallErrorNumber=EPERM
CapabilityBoundingSet=
AmbientCapabilities=
